[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lazylaunchd"
version = "0.1.0"
description = "A lazygit-style TUI and diagnostic CLI for macOS LaunchAgents and LaunchDaemons"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Cassio Marques Campos" }
]
keywords = [
    "launchd",
    "launchctl",
    "macos",
    "launchagent",
    "launchdaemon",
    "plist",
    "tui",
    "textual",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "textual>=0.82.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
icon = [
    "pillow>=10.0",
]

[project.scripts]
lazylaunchd = "lazylaunchd.cli:main"

[tool.setuptools]
packages = ["lazylaunchd"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["lazylaunchd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
